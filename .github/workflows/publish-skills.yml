name: Publish skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "skills-publish/**"
      - "scripts/publish-skills.sh"
      - ".github/workflows/publish-skills.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-skills
  cancel-in-progress: false

jobs:
  publish:
    name: Sync to mylinden-tech/skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out linden-cli
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Test skills package
        run: go test ./skills -count=1

      # Empty target repos have no refs, so actions/checkout fails with
      # "couldn't find remote ref refs/heads/main". Bootstrap when needed.
      - name: Check out mylinden-tech/skills
        env:
          SKILLS_REPO_TOKEN: ${{ secrets.SKILLS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE}/skills-repo"
          remote="https://x-access-token:${SKILLS_REPO_TOKEN}@github.com/mylinden-tech/skills.git"
          mkdir -p "$dest"
          cd "$dest"
          git init
          git remote add origin "$remote"
          if git ls-remote --heads origin main | grep -q 'refs/heads/main$'; then
            git fetch --depth=1 origin main
            git checkout -B main FETCH_HEAD
          else
            echo "Target repo has no main branch yet; creating orphan main."
            git checkout --orphan main
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish skill trees
        run: ./scripts/publish-skills.sh "${GITHUB_WORKSPACE}/skills-repo"

      - name: Commit and push if changed
        working-directory: skills-repo
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --staged --quiet; then
            echo "No skill changes to publish."
            exit 0
          fi
          git commit -m "Sync skills from ${SOURCE_REPO}@${SOURCE_SHA}" \
            -m "Autopublished by linden-cli publish-skills workflow."
          git push -u origin HEAD:main
